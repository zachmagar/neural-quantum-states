
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-quantum-states"
version = "0.1.0"
description = "Benchmarking neural quantum state architectures in PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
